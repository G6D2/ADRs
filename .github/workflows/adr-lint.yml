name: adr-lint

on:
  pull_request:
    paths:
      - "adr/**"
      - "tools/**"
  push:
    branches-ignore: [main]
    paths:
      - "adr/**"
      - "tools/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar ADRs
        run: tools/adr lint

      - name: Verificar que el índice esté actualizado
        run: |
          tools/adr index
          if ! git diff --exit-code adr/README.md; then
            echo "::error::El índice adr/README.md está desactualizado. Ejecute 'tools/adr index' y agregue el cambio al commit."
            exit 1
          fi

      - name: Verificar que el sitio se genera correctamente
        run: |
          tools/adr site /tmp/site-check
          python3 -c "import json; json.load(open('/tmp/site-check/adrs.json'))"
